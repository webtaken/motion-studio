<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Studio</title>
<style>
  :root { color-scheme: dark; --bg: #0b0c0e; --panel: #15171b; --line: #262a31; --ink: #ecebe6; --muted: #8b919a; --accent: #ff4d1f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; padding: 32px 16px; }
  main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 22px; } h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  a.v { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: inherit; text-decoration: none; }
  a.v:hover { border-color: var(--accent); }
  a.v b { font-size: 16px; } a.v small { color: var(--muted); font: 12px ui-monospace, monospace; }
  h2 { margin: 12px 0 0; font: 600 12px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Motion <span>Studio</span></h1>
  <p>Cada video es un programa: <code>window.seek(t)</code> pinta el fotograma exacto. Elige uno para previsualizarlo.</p>
  <h2>Videos</h2>
  <div class="grid" id="videos"></div>
  <h2>Plantillas</h2>
  <div class="grid" id="templates"></div>
  <p>Video nuevo: <code>npm run new -- mi-video</code></p>
</main>
<script>
  fetch('/__api/videos').then((r) => r.json()).then((list) => {
    for (const v of list) {
      const a = document.createElement('a');
      a.className = 'v';
      a.href = `/__player/#v=${encodeURIComponent(v.slug)}`;
      a.innerHTML = `<b></b><small></small>`;
      a.querySelector('b').textContent = v.title;
      a.querySelector('small').textContent = `${v.slug} · ${v.duration}s · ${v.fps} fps · ${v.bpm} BPM${v.hasMix ? ' · ♪' : ''}`;
      document.getElementById(v.template ? 'templates' : 'videos').appendChild(a);
    }
    if (!list.some((v) => !v.template)) document.getElementById('videos').innerHTML = '<p>Aún no hay videos.</p>';
  });
  new EventSource('/__events').onmessage = () => location.reload();
</script>
</body>
</html>
