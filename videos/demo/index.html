<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Showreel · seek(t)</title>
<link rel="stylesheet" href="/lib/base.css">
<style>
  /* ---------- 1. Gancho: SEEK(t) cortado en tres franjas ---------- */
  .band { position: absolute; inset: 0; display: flex; align-items: center; padding-left: calc(var(--safe-left) + var(--u) * 1); }
  .word { display: flex; flex-direction: column; align-items: flex-start; font-size: calc(var(--u) * 23); line-height: 0.9; transform-origin: 0 50%; }
  html[data-fmt='1x1'] .word { font-size: calc(var(--u) * 21); }
  html[data-orient='landscape'] .word { flex-direction: row; align-items: baseline; font-size: calc(var(--u) * 22); }
  html[data-orient='landscape'] .band { padding-left: calc(var(--w) * 0.1); }
  .w2 { color: var(--accent); display: inline-block; transform-origin: 10% 70%; }

  /* ---------- 2. Tira de fotogramas ---------- */
  .frames { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 5); }
  .grid { display: grid; gap: calc(var(--u) * 2); }
  .tile { position: relative; background: var(--surface); border-radius: calc(var(--u) * 1.4); outline: calc(var(--u) * 0.5) solid transparent; overflow: hidden; }
  .tile i { position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); }
  .tile b { position: absolute; left: 10%; right: 10%; bottom: 12%; height: calc(var(--u) * 0.35); background: var(--line); }
  .cap { text-align: center; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
  .cap .title { font-size: calc(var(--u) * 7.4); }
  .cap .mono { font: 500 calc(var(--u) * 3.8) var(--font-ui); color: var(--muted); letter-spacing: 0.01em; }
  html[data-orient='landscape'] .frames { flex-direction: row; gap: calc(var(--u) * 8); }
  html[data-orient='landscape'] .cap { text-align: left; max-width: calc(var(--w) * 0.3); }

  /* ---------- 3. Círculo → botón ---------- */
  .btn { position: absolute; left: 0; top: 0; background: var(--accent); border-radius: 999px; display: grid; place-items: center; overflow: hidden; }
  .btn span { font: 700 calc(var(--u) * 5) var(--font-ui); color: var(--bg); white-space: nowrap; position: relative; z-index: 2; }
  .btn .fill { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.18); transform-origin: 0 50%; z-index: 1; }

  /* ---------- 4. Verbos (fondo claro) ---------- */
  #verbos { background: var(--ink); color: var(--bg); }
  .verb { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: calc(var(--safe-left) + var(--u) * 1); gap: calc(var(--u) * 3); }
  html[data-orient='landscape'] .verb { padding-left: calc(var(--w) * 0.12); }
  .verb .title { font-size: calc(var(--u) * 17); display: inline-block; }
  .verb .bar { width: calc(var(--u) * 30); height: calc(var(--u) * 1.8); background: var(--accent); border-radius: 99px; }

  /* ---------- 5. Dato + gráfico ---------- */
  .chart { display: flex; flex-direction: column; justify-content: center; padding: 0 calc(var(--safe-left) + var(--u) * 1); gap: calc(var(--u) * 4); }
  html[data-orient='landscape'] .chart { flex-direction: row; align-items: center; padding: 0 calc(var(--w) * 0.08); gap: calc(var(--u) * 8); }
  .num { display: flex; align-items: baseline; gap: calc(var(--u) * 2); }
  .num .title { font-size: calc(var(--u) * 30); font-variant-numeric: tabular-nums; line-height: 0.9; }
  .num .unit { font: 700 calc(var(--u) * 7) var(--font-title); color: var(--accent); }
  .num-wrap { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
  .num-wrap .sub { font: 500 calc(var(--u) * 4.4) var(--font-ui); color: var(--muted); }
  svg.plot { width: 100%; height: calc(var(--u) * 46); overflow: visible; }
  html[data-orient='landscape'] svg.plot { width: calc(var(--w) * 0.44); height: calc(var(--u) * 50); }

  /* ---------- 6. Cierre ---------- */
  .outro { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 4.5); text-align: center; }
  html[data-orient='landscape'] .outro { flex-direction: row; gap: calc(var(--u) * 6); text-align: left; }
  .lock { display: flex; flex-direction: column; gap: calc(var(--u) * 2); align-items: inherit; }
  html[data-orient='landscape'] .lock { align-items: flex-start; }
  .mark { width: calc(var(--u) * 22); height: calc(var(--u) * 22); border: calc(var(--u) * 1.7) solid var(--ink); border-radius: calc(var(--u) * 4.4); position: relative; overflow: hidden; flex: none; }
  .mark i { position: absolute; top: 14%; bottom: 14%; width: calc(var(--u) * 2.4); background: var(--accent); border-radius: 99px; }
  .outro .name { font-size: calc(var(--u) * 10.5); }
  .outro .tag { font: 500 calc(var(--u) * 4.4) var(--font-ui); color: var(--muted); min-height: 1.3em; }
</style>
</head>
<body>
<div id="stage">
  <section id="frames" class="layer frames">
    <div class="grid" id="grid"></div>
    <div class="cap">
      <div class="title" id="capTitle">CADA FOTOGRAMA</div>
      <div class="mono" id="capSub"></div>
    </div>
  </section>

  <section id="hook" class="layer">
    <div class="band"><div class="title word"><span class="w1">SEEK</span><span class="w2">(t)</span></div></div>
  </section>

  <section id="boton" class="layer">
    <div class="btn" id="btn"><div class="fill" id="fill"></div><span id="btnText">Renderizar</span></div>
  </section>

  <section id="verbos" class="layer">
    <div class="verb" id="v0"><div class="title">ESCALA</div><div class="bar"></div></div>
    <div class="verb" id="v1"><div class="title">GIRA</div><div class="bar"></div></div>
    <div class="verb" id="v2"><div class="title">FRENA</div><div class="bar"></div></div>
    <div class="verb" id="v3"><div class="title">REBOTA</div><div class="bar"></div></div>
  </section>

  <section id="dato" class="layer chart">
    <div class="num-wrap">
      <div class="num"><span class="title" id="fps">0</span><span class="unit">fps</span></div>
      <div class="sub" id="fpsSub">sin After Effects</div>
    </div>
    <svg class="plot" id="plot" viewBox="0 0 1000 460" preserveAspectRatio="none">
      <g id="gridlines" stroke="var(--line)" stroke-width="2"></g>
      <path id="line" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
    </svg>
  </section>

  <section id="cierre" class="layer outro">
    <div class="mark" id="mark"><i id="markHead"></i></div>
    <div class="lock">
      <div class="title name" id="name">motion studio</div>
      <div class="tag" id="tag"></div>
    </div>
  </section>
</div>

<script type="module">
import {
  defineVideo, scenes, splitText, spring, SPRINGS, stagger2D, track, keyframes, progress,
  createCursor, countUp, typewriter, grain, punch, clamp, ease, lerp,
} from '/lib/motion.js';

// Guion en beats (120 BPM → 1 beat = 0,5 s). Algo nuevo cada 2–3 s.
const T = { hook: 0, frames: 4.4, boton: 10, verbos: 14.1, dato: 20, cierre: 25 };
const VERBS = [15, 16, 17, 18];
const TAG = 'Hecho en código con Claude Code';

let S, bands, tiles, grid, cursor, btn, g, dot, lineLen, nameChars, capChars;
let B = {}; // geometría del botón
let FALL;

defineVideo({
  async setup(ctx) {
    const u = ctx.u;
    const b = (n) => ctx.beat(n);

    // 1. Tres copias de la palabra, cada una recortada a un tercio de la altura.
    const hook = document.getElementById('hook');
    const base = hook.querySelector('.band');
    for (let i = 1; i < 3; i++) hook.appendChild(base.cloneNode(true));
    bands = [...hook.querySelectorAll('.band')].map((band, i) => {
      band.style.clipPath = `inset(${(i * 100) / 3}% 0 ${((2 - i) * 100) / 3}% 0)`;
      return { el: band, word: band.querySelector('.word'), letters: splitText(band.querySelector('.w1'), { mask: true }), t: band.querySelector('.w2') };
    });

    // 2. Grilla: cada celda es UN fotograma de una pelota que rebota.
    grid = document.getElementById('grid');
    const [cols, rows] = ctx.pick({ '9x16': [4, 4], '1x1': [6, 3], '16x9': [6, 3] });
    const tw = ctx.pick({ '9x16': 19 * u, '1x1': 13.6 * u, '16x9': 13 * u });
    grid.style.gridTemplateColumns = `repeat(${cols}, ${tw}px)`;
    const n = cols * rows;
    tiles = [];
    for (let k = 0; k < n; k++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.width = `${tw}px`;
      tile.style.height = `${tw * 1.33}px`;
      const p = k / (n - 1);
      const bounce = Math.abs(Math.cos(p * Math.PI * 2.5)) * (1 - p) ** 1.2; // rebotes que se apagan
      tile.innerHTML = `<i style="left:${10 + p * 58}%;bottom:${12 + bounce * 62}%"></i><b></b>`;
      grid.appendChild(tile);
      tiles.push({ el: tile, col: k % cols, row: Math.floor(k / cols) });
    }
    capChars = splitText(document.getElementById('capTitle'), { by: 'words', mask: true });

    // 3. Botón: centro, medidas finales y el clic del cursor.
    const cx = ctx.w / 2;
    const cy = ctx.pick({ '9x16': ctx.h * 0.47, default: ctx.h / 2 });
    B = { cx, cy, d: 18 * u, pw: ctx.pick({ '9x16': 62 * u, '1x1': 62 * u, '16x9': 50 * u }), ph: 15 * u };
    btn = document.getElementById('btn');
    cursor = createCursor(ctx, {
      points: [
        { t: b(12), x: ctx.w * 0.9, y: ctx.h * 0.92 },
        { t: b(13), x: cx + B.pw * 0.18, y: cy + B.ph * 0.15, click: true, travel: 0.45 },
        { t: b(14), x: cx + B.pw * 0.24, y: cy + B.ph * 0.6, travel: 0.4 },
      ],
      show: [b(12), b(T.verbos) + 0.2],
    });

    // 5. Gráfico: línea que sube con ruido con semilla (misma siempre).
    const gl = document.getElementById('gridlines');
    for (let i = 0; i <= 4; i++) gl.innerHTML += `<line x1="0" x2="1000" y1="${20 + i * 105}" y2="${20 + i * 105}" />`;
    const pts = Array.from({ length: 13 }, (_, i) => {
      const x = (i / 12) * 1000;
      const y = 420 - (i / 12) ** 1.4 * 360 + (ctx.rand(i, 'chart') - 0.5) * 70 * (i > 0 && i < 12 ? 1 : 0);
      return [x, Math.max(20, Math.min(440, y))];
    });
    const d = pts.map(([x, y], i) => (i ? `L${x.toFixed(1)},${y.toFixed(1)}` : `M${x},${y}`)).join(' ');
    const line = document.getElementById('line');
    line.setAttribute('d', d);
    lineLen = line.getTotalLength();
    line.style.strokeDasharray = `${lineLen}`;
    dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', '16');
    dot.setAttribute('fill', 'var(--accent)');
    document.getElementById('plot').appendChild(dot);

    // 6. Cierre.
    nameChars = splitText(document.getElementById('name'), { mask: true });

    // La pelota debe tocar el piso EXACTO en el beat 10: medimos cuánto tarda en caer.
    FALL = { from: -ctx.h * 0.62, to: 0, stiffness: 240, damping: 13 };
    let land = 0;
    while (spring(land, FALL) < 0 && land < 1) land += 0.001;
    const ballStart = b(T.boton) - land;

    S = scenes(ctx, [
      { id: 'hook', start: 0, end: b(5) },
      { id: 'frames', start: b(T.frames), end: ballStart, sfxIn: 'whoosh' },
      { id: 'boton', start: ballStart, end: b(15) },
      { id: 'verbos', start: b(T.verbos), end: b(T.dato), sfxIn: 'whoosh' },
      { id: 'dato', start: b(T.dato), end: b(T.cierre), sfxIn: 'impact' },
      { id: 'cierre', start: b(T.cierre), end: ctx.duration, sfxIn: 'impact' },
    ]);

    // Sonido sobre el beat.
    [0, 0.5, 1, 1.5].forEach((k) => ctx.sfx(b(k), 'tick', { gain: 0.9 }));
    ctx.sfx(b(2), 'pop');
    ctx.sfx(b(10), 'tap'); // la pelota toca el piso
    ctx.sfx(b(12), 'swipe', { gain: 0.6 });
    ctx.sfx(b(15), 'pop');
    ctx.sfx(b(16), 'swipe');
    ctx.sfx(b(17), 'swipe');
    ctx.sfx(b(17) + 0.3, 'tick');
    ctx.sfx(b(18) + 0.28, 'tap');
    ctx.sfx(b(T.cierre), 'riser', { anchor: 'end' });

    g = grain(ctx, { opacity: 0.05 });
  },

  render(t, ctx) {
    const u = ctx.u;
    const b = (n) => ctx.beat(n);
    g.render(t);

    S.render(t, {
      hook(lt) {
        const push = keyframes(lt, [[b(3), 1], [b(4.6), 1.07, 'inOutCubic']]);
        bands.forEach((band, bi) => {
          band.letters.forEach((c, i) => {
            const s = spring(lt, { ...SPRINGS.snappy, delay: b(i * 0.5) - 0.12 });
            const dir = i % 2 ? -1 : 1;
            c.style.transform = `translate(0, ${(1 - s) * 1.45 * dir}em) rotate(${(1 - s) * 10 * dir}deg)`;
          });
          const p = spring(lt, { ...SPRINGS.bouncy, delay: b(2) - 0.04 });
          band.t.style.transform = `scale(${Math.max(0, p)}) rotate(${(1 - p) * -18}deg)`;
          // Salida: cada franja se va hacia un lado distinto.
          const out = progress(lt, b(4.4), b(5), 'inExpo');
          const dir = bi === 1 ? 1 : -1;
          band.el.style.transform = `translate(${Math.round(dir * out * ctx.w * 1.15)}px, 0)`;
          band.word.style.transform = `scale(${push})`;
        });
      },

      frames(lt, sc) {
        const cols = Math.max(...tiles.map((x) => x.col)) + 1;
        const rows = Math.max(...tiles.map((x) => x.row)) + 1;
        const n = tiles.length;
        const head = Math.floor(progress(lt, 1.0, sc.dur - 0.2, 'linear') * n); // reproduce la tira
        tiles.forEach((tl, k) => {
          const d = 0.15 + stagger2D(tl.col, tl.row, { each: 0.045, origin: [(cols - 1) / 2, (rows - 1) / 2] });
          const s = spring(lt, { ...SPRINGS.snappy, delay: d });
          const on = k === Math.min(head, n - 1) && lt >= 1.0;
          tl.el.style.transform = `scale(${Math.max(0, s) * (on ? 1.08 : 1)})`;
          tl.el.style.outlineColor = on ? 'var(--accent)' : 'transparent';
          tl.el.style.opacity = lt >= 1.0 && k > head ? '0.45' : '1';
        });
        capChars.forEach((c, i) => {
          const s = spring(lt, { ...SPRINGS.snappy, delay: 0.55 + i * 0.12 });
          c.style.transform = `translate(0, ${(1 - s) * 1.45}em)`;
        });
        document.getElementById('capSub').textContent = typewriter('seek(t) → el fotograma exacto', lt, { start: 1.0, cps: 34 }) || ' ';
      },

      boton(lt, sc) {
        const at = (n) => b(n) - sc.start; // beat → tiempo local de la escena
        const fall = spring(lt, FALL);
        const v = (spring(lt + 0.01, FALL) - fall) / 0.01;
        // Estira con la velocidad; aplasta al pasarse del piso.
        const stretch = clamp(Math.abs(v) / 9000, 0, 0.35);
        const squash = clamp(fall / (8 * u), 0, 0.3);
        let sy = 1 + stretch - squash;
        let sx = 1 / sy;
        const m = progress(lt, at(11.9), at(12.6), 'snap'); // círculo → píldora
        const wpx = lerp(B.d, B.pw, m);
        const hpx = lerp(B.d, B.ph, m);
        if (m > 0) (sx = lerp(sx, 1, m)), (sy = lerp(sy, 1, m));
        const click = at(13);
        const press = lt >= click - 0.06 && lt < click + 0.2 ? 1 - 0.06 * Math.sin(Math.PI * clamp((lt - click + 0.06) / 0.26)) : 1;
        const exit = progress(lt, at(14.1), at(15), 'inExpo');
        Object.assign(btn.style, { width: `${wpx}px`, height: `${hpx}px` });
        btn.style.transform = `translate(${B.cx - wpx / 2}px, ${B.cy - hpx / 2 + fall}px) scale(${sx * press * (1 + exit * 0.4)}, ${sy * press * (1 + exit * 0.4)})`;
        const txt = document.getElementById('btnText');
        track(txt, lt, { clipX: progress(lt, at(12.2), at(12.8), 'outCubic') });
        txt.textContent = lt >= at(14) ? 'Listo ✓' : lt >= click ? 'Renderizando…' : 'Renderizar';
        document.getElementById('fill').style.transform = `scaleX(${progress(lt, click, at(14), 'inOutCubic')})`;
      },

      verbos(lt, sc) {
        // Entra como círculo que crece desde el botón (transición de máscara).
        const r = progress(lt, 0, sc.start < b(15) ? b(15) - sc.start : 0.4, 'inOutExpo') * Math.hypot(ctx.w, ctx.h);
        document.getElementById('verbos').style.clipPath = `circle(${r}px at ${B.cx}px ${B.cy}px)`;
        VERBS.forEach((vb, i) => {
          const el = document.getElementById(`v${i}`);
          const start = b(vb) - sc.start;
          const end = i < 3 ? b(VERBS[i + 1]) - sc.start : sc.dur;
          const on = lt >= start && lt < end;
          el.style.visibility = on ? 'visible' : 'hidden';
          if (!on) return;
          const l = lt - start;
          const word = el.querySelector('.title');
          const bar = el.querySelector('.bar');
          track(bar, l, { clipX: progress(l, 0.12, 0.4, 'outCubic') });
          if (i === 0) track(word, l, { scale: keyframes(l, [[0, 0.62], [0.16, 1.08, 'outCubic'], [0.36, 1, 'inOutQuad'], [0.5, 1.03, 'linear']]) });
          if (i === 1) {
            const s = spring(l, { ...SPRINGS.bouncy, from: -120, to: 0 });
            track(word, l, { rotate: s });
            word.style.transformOrigin = '50% 60%';
          }
          if (i === 2) {
            const x = keyframes(l, [[0, ctx.w * 0.5], [0.24, 0, 'outExpo']]);
            const sk = keyframes(l, [[0, -28], [0.24, 0, 'outQuart'], [0.36, 6, 'outQuad'], [0.55, 0, 'inOutQuad']]);
            track(word, l, { x, skewX: sk });
          }
          if (i === 3) {
            const y = spring(l, { from: -ctx.h * 0.35, to: 0, stiffness: 260, damping: 11 });
            const sq = clamp(y / (5 * u), 0, 0.25);
            word.style.transformOrigin = '50% 100%';
            track(word, l, { y, scaleX: 1 + sq * 0.6, scaleY: 1 - sq });
          }
        });
      },

      dato(lt) {
        const el = document.getElementById('fps');
        el.textContent = countUp(lt, { start: -0.12, end: 0.9, from: 0, to: 60, ease: 'outExpo' });
        track(el.parentElement, lt, { scale: keyframes(lt, [[0, 1.12], [0.35, 1, 'snap']]) * punch(lt, 0.95, { amount: 0.04 }) });
        track(document.getElementById('fpsSub'), lt, { clipX: progress(lt, 0.7, 1.1, 'outCubic') });
        const p = progress(lt, 0.25, 1.9, 'inOutCubic');
        const line = document.getElementById('line');
        line.style.strokeDashoffset = `${lineLen * (1 - p)}`;
        const pt = line.getPointAtLength(lineLen * p);
        dot.setAttribute('cx', pt.x.toFixed(2));
        dot.setAttribute('cy', pt.y.toFixed(2));
        dot.setAttribute('r', String(16 * spring(lt, { ...SPRINGS.bouncy, delay: 0.2 })));
      },

      cierre(lt) {
        const s = spring(lt + 0.12, { ...SPRINGS.bouncy }); // ya grande en el golpe
        track(document.getElementById('mark'), lt, { scale: s, rotate: (1 - s) * -24 });
        document.getElementById('markHead').style.left = `${keyframes(lt, [[0.25, 10], [1.4, 74, 'inOutCubic']])}%`;
        nameChars.forEach((c, i) => {
          const k = spring(lt, { ...SPRINGS.snappy, delay: 0.18 + i * 0.03 });
          c.style.transform = `translate(0, ${(1 - k) * 1.45}em)`;
        });
        document.getElementById('tag').textContent = typewriter(TAG, lt, { start: 0.85, cps: 30 }) || ' ';
      },
    });
    cursor.render(t);
  },
});
</script>
</body>
</html>
